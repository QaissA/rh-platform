<section class="login">
  <div class="login__brandpane">
    <div class="login__wordmark">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14c4-6 8 6 12 0s5-4 6-2"/><path d="M3 19c4-6 8 6 12 0s5-4 6-2"/></svg>
      </span>
      Alizé
    </div>
    <div class="login__pitch">
      <h1>{{ 'login.headline' | t }}</h1>
      <p>{{ 'login.pitch' | t }}</p>
    </div>
    <div class="login__meta">
      <div><div class="k num">18,5</div><div class="l">{{ 'login.statBalance' | t }}</div></div>
      <div><div class="k num">7</div><div class="l">{{ 'login.statTeammates' | t }}</div></div>
      <div><div class="k num">2</div><div class="l">{{ 'login.statPending' | t }}</div></div>
    </div>
  </div>

  <div class="login__formpane">
    <form class="login__form" (ngSubmit)="submit()">
      <div style="display:flex;justify-content:flex-end;margin-bottom:18px"><app-lang-switcher /></div>
      <h2>{{ 'login.welcome' | t }}</h2>
      <p class="sub">{{ 'login.subtitle' | t }}</p>

      <div class="field">
        <label for="email">{{ 'login.email' | t }}</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" autocomplete="username" />
      </div>
      <div class="field">
        <label for="pwd">{{ 'login.password' | t }}</label>
        <input id="pwd" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" />
      </div>

      @if (error()) {
        <div class="login__error">{{ error() }}</div>
      }

      <button class="btn btn--primary btn--block" type="submit" [disabled]="loading()">
        @if (loading()) { <span class="spinner" style="width:16px;height:16px;border-width:2px"></span> {{ 'login.submitting' | t }} }
        @else { {{ 'login.submit' | t }} }
      </button>

      <div class="demohint">
        {{ 'login.demos' | t }}
        <div class="demo-chips">
          <button type="button" class="demo-chip" (click)="fillDemo('employee@rh.local')">{{ 'login.demoEmployee' | t }}</button>
          <button type="button" class="demo-chip" (click)="fillDemo('manager@rh.local')">{{ 'login.demoManager' | t }}</button>
          <button type="button" class="demo-chip" (click)="fillDemo('rh@rh.local')">{{ 'login.demoRh' | t }}</button>
        </div>
      </div>
    </form>
  </div>
</section>
